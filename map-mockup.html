<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tactical Map — Bunker Planning Desk (NW corner)</title>
<!--
  TanKING tactical-map redesign — DIALED-DOWN bunker planning nook (NW corner L-station).
  Not a war room: one guy's planning corner — a worn desk, a pinned zone-map, a banker lamp,
  a corkboard, and supply clutter. Cozy-apocalypse, lived-in.
  Serve over HTTP:  cd game && python3 -m http.server 8744  →  http://localhost:8744/map-mockup.html
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070a; font-family: monospace; }
  #c { width: 100%; height: 100%; touch-action: none; display: block; }
  .panel { position: absolute; z-index: 10; background: rgba(0,8,20,0.93); border: 1px solid #00e5ff44;
    padding: 14px 16px; color: #9bdfe8; font-size: 11px; letter-spacing: 1px; box-shadow: 0 0 24px #00000088; }
  #left { top: 14px; left: 14px; width: 240px; }
  h1 { color: #00e5ff; font-size: 13px; letter-spacing: 3px; margin: 0 0 4px; }
  .sub { color: #4a6b72; font-size: 9px; margin-bottom: 10px; line-height: 1.5; }
  .hint { margin-top: 10px; color: #4a6b72; font-size: 9px; line-height: 1.6; } .hint b { color: #7fc8d4; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="left" class="panel">
  <h1>PLANNING DESK</h1>
  <div class="sub">NW corner · bunker planning nook<br>(dialed-down, lived-in)</div>
  <div class="hint"><b>Drag</b> empty space to orbit · scroll to zoom.<br>
  Tell me what to add/cut/move, then I build the drag-to-move editor so you can polish it yourself.</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const { Engine, Scene, ArcRotateCamera, HemisphericLight, DirectionalLight, PointLight,
        MeshBuilder, StandardMaterial, Color3, Color4, Vector3, TransformNode } = BABYLON;

const canvas = document.getElementById('c');
const engine = new Engine(canvas, true, { preserveDrawingBuffer: true });
const scene  = new Scene(engine);
scene.clearColor = new Color4(0.04, 0.04, 0.06, 1.0);

// NW corner: walls at west (-x) + north (+z); camera sits SE (open side) looking back.
const cam = new ArcRotateCamera('cam', Math.PI * 1.70, 0.96, 7.0, new Vector3(-2.2, 1.0, 0.7), scene);
cam.attachControl(canvas, true); cam.lowerRadiusLimit = 3.5; cam.upperRadiusLimit = 20; cam.wheelPrecision = 28;
const amb = new HemisphericLight('amb', new Vector3(0,1,0), scene);
amb.intensity = 0.66; amb.diffuse = new Color3(0.88,0.83,0.74); amb.groundColor = new Color3(0.18,0.16,0.14);
const dir = new DirectionalLight('dir', new Vector3(0.4,-1,-0.3), scene);
dir.intensity = 0.45; dir.position = new Vector3(4,12,4);

function mat(name,r,g,b,spec=0.02){ const m=new StandardMaterial(name,scene);
  m.diffuseColor=new Color3(r,g,b); m.specularColor=new Color3(spec,spec,spec); m.maxSimultaneousLights=8; return m; }
function emat(name,r,g,b,er,eg,eb){ const m=mat(name,r,g,b,0.05); m.emissiveColor=new Color3(er,eg,eb); return m; }

const M = {
  concrete: mat('concrete',0.38,0.36,0.33), floor: mat('floor',0.13,0.12,0.11),
  wood: mat('wood',0.30,0.22,0.10), woodDark: mat('wooddark',0.20,0.15,0.07),
  metal: mat('metal',0.20,0.18,0.16,0.06), darkMetal: mat('darkmetal',0.15,0.14,0.13,0.08),
  parchment: mat('parchment',0.78,0.70,0.40), paper: mat('paper',0.82,0.78,0.62),
  olive: mat('olive',0.22,0.26,0.14), crate: mat('crate',0.30,0.24,0.12),
  cork: mat('cork',0.52,0.40,0.22), mug: mat('mug',0.66,0.64,0.58,0.1),
  screenDark: mat('screen',0.04,0.06,0.05), can: mat('can',0.40,0.40,0.43,0.1),
  bookR: mat('bookr',0.45,0.15,0.12), bookB: mat('bookb',0.16,0.28,0.42), bookT: mat('bookt',0.58,0.48,0.28),
  redInd: emat('redind',0.8,0.0,0.0,0.5,0.0,0.0),
  lampShade: emat('lampshade',0.13,0.34,0.18,0.05,0.16,0.07),  // banker green, softly lit
  lantern: emat('lantern',0.9,0.7,0.3,0.5,0.36,0.10),
  redLine: emat('redline',0.62,0.10,0.10,0.12,0.0,0.0),
};

function box(p,n,w,h,d,x,y,z,m,ry=0,rz=0){ const b=MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);
  b.position=new Vector3(x,y,z); if(ry)b.rotation.y=ry; if(rz)b.rotation.z=rz; b.material=m; b.isPickable=false; b.parent=p; return b; }
function cyl(p,n,dia,h,x,y,z,m,t=16,o={}){ const c=MeshBuilder.CreateCylinder(n,{diameter:dia,height:h,tessellation:t,...o},scene);
  c.position=new Vector3(x,y,z); c.material=m; c.isPickable=false; c.parent=p; return c; }

const root = new TransformNode('planner', scene);

// ── corner walls + floor ─────────────────────────────────────────────────────
box(root,'wall-w',0.15,3.4,7,-3.55,1.7,0,M.concrete);
box(root,'wall-n',7,3.4,0.15,0,1.7,3.55,M.concrete);
const floor = MeshBuilder.CreateGround('floor',{width:10,height:10},scene);
floor.position=new Vector3(-1.3,0,0.7); floor.material=M.floor; floor.isPickable=false;

// ── the desk (worn writing desk along the west wall, facing the room) ────────
const desk = new TransformNode('desk', scene); desk.parent = root;
box(desk,'top',0.98,0.08,2.3,-2.95,0.9,0.4,M.woodDark);
[[-3.32,-0.62],[-2.58,-0.62],[-3.32,1.42],[-2.58,1.42]].forEach(([x,z],i)=>
  box(desk,'leg'+i,0.1,0.9,0.1,x,0.45,z,M.wood));
box(desk,'panel',0.06,0.66,2.1,-3.36,0.55,0.4,M.woodDark);       // modesty panel near wall
// drawer stack on the south end
box(desk,'drawers',0.84,0.7,0.62,-2.95,0.5,-0.5,M.wood);
box(desk,'drw1',0.86,0.24,0.04,-2.95,0.66,-0.81,M.woodDark);
box(desk,'drw2',0.86,0.24,0.04,-2.95,0.38,-0.81,M.woodDark);
cyl(desk,'drw1-h',0.06,0.05,-2.95,0.66,-0.84,M.metal,8).rotation.x=Math.PI/2;
cyl(desk,'drw2-h',0.06,0.05,-2.95,0.38,-0.84,M.metal,8).rotation.x=Math.PI/2;

// ── pinned zone-map on the west wall, above the desk ─────────────────────────
const wallmap = new TransformNode('wallmap', scene); wallmap.parent = root;
box(wallmap,'map',0.04,1.2,1.7,-3.46,1.75,0.5,M.parchment);
box(wallmap,'map-frame',0.03,1.32,1.82,-3.49,1.75,0.5,M.darkMetal);
// a route scrawled across it + a few pins
box(wallmap,'route1',0.012,0.04,0.5,-3.435,1.8,0.35,M.redLine,0,0.5);
box(wallmap,'route2',0.012,0.04,0.5,-3.435,1.62,0.75,M.redLine,0,-0.4);
[[2.1,0.1],[1.9,0.7],[1.55,0.45],[2.0,-0.25]].forEach(([dy,dz],i)=>
  cyl(wallmap,'pin'+i,0.05,0.06,-3.42,dy,0.5+dz,M.redInd,6).rotation.z=Math.PI/2);

// ── corkboard of notes on the north wall ─────────────────────────────────────
const cork = new TransformNode('cork', scene); cork.parent = root;
box(cork,'cork',1.3,1.0,0.04,-1.7,1.6,3.46,M.cork);
box(cork,'cork-frame',1.42,1.12,0.03,-1.7,1.6,3.49,M.wood);
[[-0.35,0.2,M.paper],[0.1,0.25,M.paper],[0.32,-0.15,M.parchment],[-0.2,-0.2,M.paper]].forEach(([dx,dy,pm],i)=>
  box(cork,'note'+i,0.34,0.4,0.02,-1.7+dx,1.6+dy,3.44,pm,0,(i%2?0.06:-0.05)));
box(cork,'photo',0.26,0.3,0.02,-1.7+0.0,1.62,3.44,M.darkMetal);

// ── wall shelf (north wall) with a couple cans + a lantern ───────────────────
const shelf = new TransformNode('shelf', scene); shelf.parent = root;
box(shelf,'plank',1.5,0.05,0.32,0.7,1.45,3.36,M.wood);
box(shelf,'brkL',0.04,0.3,0.28,0.0,1.3,3.36,M.metal);
box(shelf,'brkR',0.04,0.3,0.28,1.4,1.3,3.36,M.metal);
cyl(shelf,'can1',0.18,0.26,0.35,1.6,3.34,M.can,14);
cyl(shelf,'can2',0.18,0.26,0.6,1.6,3.34,M.can,14);
box(shelf,'lantern',0.2,0.3,0.2,1.15,1.62,3.34,M.lantern);
box(shelf,'lantern-cap',0.12,0.08,0.12,1.15,1.79,3.34,M.darkMetal);

// ── supply crates stacked in the corner ──────────────────────────────────────
const crates = new TransformNode('crates', scene); crates.parent = root;
box(crates,'crate1',0.74,0.7,0.74,-3.0,0.35,2.95,M.crate);
box(crates,'crate1-b1',0.78,0.05,0.05,-3.0,0.5,2.6,M.metal);
box(crates,'crate1-b2',0.78,0.05,0.05,-3.0,0.5,3.3,M.metal);
box(crates,'crate2',0.62,0.6,0.62,-3.02,0.99,2.92,M.crate);
box(crates,'crate2-lid',0.66,0.05,0.66,-3.02,1.31,2.92,M.olive);
box(crates,'jerry',0.26,0.46,0.42,-2.35,0.23,3.05,M.olive);
cyl(crates,'jerry-cap',0.08,0.06,-2.35,0.48,3.05,M.darkMetal,8);

// ── stool at the desk ────────────────────────────────────────────────────────
const stool = new TransformNode('stool', scene); stool.parent = root;
cyl(stool,'seat',0.38,0.08,-2.05,0.5,0.5,M.wood,16);
[[-0.13,-0.13],[0.13,-0.13],[0,0.16]].forEach(([dx,dz],i)=>
  cyl(stool,'sleg'+i,0.05,0.5,-2.05+dx,0.25,0.5+dz,M.metal,6));

// ── banker desk lamp (warm pool) ─────────────────────────────────────────────
const lamp = new TransformNode('lamp', scene); lamp.parent = root;
cyl(lamp,'l-base',0.22,0.04,-3.05,0.96,1.35,M.darkMetal,16);
cyl(lamp,'l-stem',0.04,0.32,-3.05,1.13,1.35,M.metal,8);
box(lamp,'l-shade',0.36,0.1,0.18,-3.0,1.32,1.35,M.lampShade,0,0.18);
const ll = new PointLight('l-light', new Vector3(-2.9,1.25,1.3), scene);
ll.diffuse=new Color3(1.0,0.84,0.5); ll.intensity=2.2; ll.range=6; ll.parent=lamp;

// ── desk clutter (papers, clipboard, radio, mug, books, pencils) ─────────────
const clutter = new TransformNode('clutter', scene); clutter.parent = root;
const T = 0.95;
cyl(clutter,'roll1',0.06,0.5,-2.85,T+0.03,-0.05,M.parchment,8).rotation.x=Math.PI/2;
cyl(clutter,'roll2',0.06,0.46,-2.78,T+0.03,0.08,M.paper,8).rotation.x=Math.PI/2;
box(clutter,'clipboard',0.32,0.02,0.44,-2.82,T,0.45,M.paper,0.2);
box(clutter,'clip',0.1,0.02,0.06,-2.82,T+0.02,0.66,M.metal);
box(clutter,'notebook',0.28,0.04,0.36,-3.0,T,0.95,M.olive,-0.15);
cyl(clutter,'mug',0.14,0.16,-2.62,T+0.05,1.05,M.mug,12);
cyl(clutter,'pencils',0.1,0.16,-3.02,T+0.05,1.18,M.darkMetal,8);
[[-0.06,0.18],[0.0,0.2],[0.05,0.16]].forEach(([dx,h],i)=>
  cyl(clutter,'pencil'+i,0.015,0.22,-3.02+dx,T+h,1.18,M.bookT,6));
// stacked books
box(clutter,'book1',0.3,0.06,0.22,-3.05,T+0.0,0.0,M.bookR,0.1);
box(clutter,'book2',0.28,0.06,0.2,-3.04,T+0.06,0.02,M.bookB,0.0);
box(clutter,'book3',0.26,0.05,0.2,-3.05,T+0.115,-0.01,M.bookT,-0.08);
// little field radio
box(clutter,'radio',0.4,0.24,0.3,-2.7,T+0.12,-0.7,M.darkMetal);
box(clutter,'radio-screen',0.16,0.12,0.02,-2.49,T+0.14,-0.7,M.screenDark);
cyl(clutter,'radio-ind',0.04,0.03,-2.49,T+0.22,-0.62,M.redInd,8).rotation.z=Math.PI/2;
cyl(clutter,'radio-ant',0.02,0.5,-2.55,T+0.4,-0.85,M.metal,6).rotation.z=-0.3;

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize', ()=>engine.resize());
</script>
</body>
</html>

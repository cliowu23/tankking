<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Radio Station — North-Wall Poster Concepts (v2)</title>
<!--
  Customizable north-wall poster (easter egg: hover precisely → cycle/customize).
  Re-keyed to ART_DIRECTION.md: vibrant-but-grounded, flat colors / hard edges,
  TanKING heraldry = red+gold, resistance = cobalt+gold, World-1 = green fields.
    A WANTED: the TanKING (red+gold)   B Cozy painting — World-1 fields (home)
    C Morale poster (resistance cobalt+gold)   D Swappable photo (green-fields default)
  Serve over HTTP:  cd game && python3 -m http.server 8744  →  http://localhost:8744/poster-concepts.html
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070a; font-family: monospace; }
  #c { width: 100%; height: 100%; touch-action: none; display: block; }
  .panel { position: absolute; z-index: 10; background: rgba(0,8,20,0.93); border: 1px solid #00e5ff44;
    padding: 14px 16px; color: #9bdfe8; font-size: 11px; letter-spacing: 1px; box-shadow: 0 0 24px #00000088; }
  #left { top: 14px; left: 14px; width: 250px; }
  h1 { color: #00e5ff; font-size: 13px; letter-spacing: 2px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .row button { flex: 1 1 46%; text-align: center; }
  button { background: #0a1824; color: #7fc8d4; border: 1px solid #1b4250; padding: 9px 8px;
    font-family: monospace; font-size: 10px; cursor: pointer; letter-spacing: 1px; transition: all 0.1s; }
  button:hover { border-color: #00e5ff66; color: #bdeef4; }
  button.on { background: #00e5ff22; border-color: #00e5ff; color: #d8fbff; box-shadow: 0 0 8px #00e5ff44; }
  .cap { color: #5fb8c4; font-size: 10px; line-height: 1.6; } .cap b { color: #d8fbff; }
  .hint { margin-top: 10px; color: #4a6b72; font-size: 9px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="left" class="panel">
  <h1>POSTER CONCEPTS · v2</h1>
  <div class="row">
    <button id="bA" class="on">A · WANTED</button>
    <button id="bB">B · FIELDS</button>
    <button id="bC">C · MORALE</button>
    <button id="bD">D · PHOTO</button>
  </div>
  <div class="cap" id="cap"></div>
  <div class="hint">Drag to orbit · scroll to zoom. Tell me which designs land / want changed.</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const { Engine, Scene, ArcRotateCamera, HemisphericLight, DirectionalLight,
        MeshBuilder, StandardMaterial, DynamicTexture, Color3, Color4, Vector3 } = BABYLON;

const canvas = document.getElementById('c');
const engine = new Engine(canvas, true, { preserveDrawingBuffer: true });
const scene  = new Scene(engine);
scene.clearColor = new Color4(0.05,0.05,0.07,1);

const cam = new ArcRotateCamera('cam', Math.PI*1.5, Math.PI*0.5, 3.6, new Vector3(0,1.6,3.2), scene);
cam.attachControl(canvas,true); cam.lowerRadiusLimit=1.6; cam.upperRadiusLimit=8; cam.wheelPrecision=40;
const amb = new HemisphericLight('amb', new Vector3(0,1,0), scene); amb.intensity=0.95;
const dir = new DirectionalLight('dir', new Vector3(0,-0.4,1), scene); dir.intensity=0.2;

function mat(n,r,g,b){ const m=new StandardMaterial(n,scene); m.diffuseColor=new Color3(r,g,b); m.specularColor=new Color3(0,0,0); return m; }

const wall = MeshBuilder.CreateBox('wall',{width:6,height:5,depth:0.15},scene);
wall.position=new Vector3(0,2.5,3.55); wall.material=mat('wall',0.38,0.36,0.33);
const floor = MeshBuilder.CreateGround('floor',{width:8,height:8},scene);
floor.position=new Vector3(0,0,1.5); floor.material=mat('floor',0.13,0.12,0.11);

const POSTER_W=1.2, POSTER_H=1.68;
const frame = MeshBuilder.CreateBox('frame',{width:POSTER_W+0.12,height:POSTER_H+0.12,depth:0.05},scene);
frame.position=new Vector3(0,1.6,3.45); frame.material=mat('frame',0.16,0.12,0.07);
const poster = MeshBuilder.CreatePlane('poster',{width:POSTER_W,height:POSTER_H},scene);
poster.position=new Vector3(0,1.6,3.42);

const CW=540, CH=756;
const dt = new DynamicTexture('poster-dt',{width:CW,height:CH},scene,false);  // no mipmaps
dt.hasAlpha = false;
const pmat = new StandardMaterial('pmat',scene);
pmat.diffuseTexture = dt;                       // proven DynamicTexture channel
pmat.specularColor = new Color3(0,0,0);
pmat.emissiveColor = new Color3(0.45,0.45,0.45);
pmat.backFaceCulling = false;
poster.material = pmat;

// ── canvas helpers ───────────────────────────────────────────────────────────
function noise(x,W,H,n,a){ for(let i=0;i<n;i++){ x.fillStyle=`rgba(80,60,30,${a})`;
  const rx=Math.random()*W, ry=Math.random()*H, rr2=4+Math.random()*22;
  x.beginPath(); x.ellipse(rx,ry,rr2,rr2*0.7,Math.random()*3,0,7); x.fill(); } }
function star(x,cx,cy,r,col){ x.fillStyle=col; x.beginPath(); for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2;
  const rad=i%2?r*0.45:r; x.lineTo(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad); } x.closePath(); x.fill(); }
// draw centered text, shrinking the font until it fits within maxW
function fitText(x,txt,cx,y,maxW,px){ const f=p=>'900 '+p+'px "Arial Black",Impact,sans-serif';
  x.font=f(px); while(px>10 && x.measureText(txt).width>maxW){ px-=2; x.font=f(px); } x.fillText(txt,cx,y); }

// ── A · WANTED: the TanKING (red + gold heraldry) ───────────────────────────
function drawWanted(x){
  x.fillStyle='#d8c69a'; x.fillRect(0,0,CW,CH); noise(x,CW,CH,42,0.05);
  // red heraldic bands top + bottom, gold pinstripe
  x.fillStyle='#8e2118'; x.fillRect(0,0,CW,96); x.fillRect(0,CH-104,CW,104);
  x.fillStyle='#e7b53a'; x.fillRect(0,92,CW,5); x.fillRect(0,CH-109,CW,5);
  x.strokeStyle='#241a0e'; x.lineWidth=8; x.strokeRect(20,20,CW-40,CH-40);
  x.textAlign='center';
  x.fillStyle='#f0e3c0'; x.font='900 64px "Arial Black", Impact, sans-serif'; x.fillText('WANTED', CW/2, 80);
  x.fillStyle='#241a0e'; x.font='bold 30px Georgia'; x.fillText('— DEAD OR ALIVE —', CW/2, 150);
  // mugshot: red mat + gold frame
  const px=82,py=188,pw=CW-164,ph=296;
  x.fillStyle='#7e1d15'; x.fillRect(px-8,py-8,pw+16,ph+16);
  x.strokeStyle='#e7b53a'; x.lineWidth=5; x.strokeRect(px-8,py-8,pw+16,ph+16);
  x.fillStyle='#c8c7c0'; x.fillRect(px,py,pw,ph);
  x.strokeStyle='rgba(40,30,20,0.22)'; x.lineWidth=2;
  for(let gy=py+34; gy<py+ph; gy+=40){ x.beginPath(); x.moveTo(px,gy); x.lineTo(px+pw,gy); x.stroke(); }
  drawTankKing(x, CW/2, py+ph/2+24, 1.0);
  // reward block
  x.fillStyle='#241a0e'; x.font='900 58px Georgia'; x.fillText('REWARD', CW/2, py+ph+72);
  x.fillStyle='#7e1d15'; x.font='bold 28px Georgia'; x.fillText('THE THRONE OF TANKFORD', CW/2, py+ph+110);
  x.fillStyle='#f0e3c0'; x.font='italic 21px Georgia'; x.fillText('· by order of the resistance ·', CW/2, CH-42);
  // distress
  x.strokeStyle='rgba(30,20,10,0.12)'; x.lineWidth=1;
  for(let i=0;i<22;i++){ const sx=Math.random()*CW, sy=Math.random()*CH;
    x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+Math.random()*40-20, sy+Math.random()*40-20); x.stroke(); }
}
function drawTankKing(x,cx,cy,s){
  x.save(); x.translate(cx,cy); x.scale(s,s);
  x.fillStyle='#23272d'; x.fillRect(-108,30,216,30);                     // track slab
  x.fillStyle='#3a3f47'; for(let i=-92;i<=92;i+=26){ x.beginPath(); x.arc(i,45,11,0,7); x.fill(); }
  x.fillStyle='#3c424b'; x.beginPath(); x.moveTo(-100,32); x.lineTo(-86,-6); x.lineTo(90,-6); x.lineTo(104,32); x.closePath(); x.fill();   // angled hull
  x.fillStyle='#4a515b'; x.beginPath(); x.moveTo(-54,-6); x.lineTo(-42,-50); x.lineTo(40,-50); x.lineTo(58,-6); x.closePath(); x.fill();   // angular turret
  x.fillStyle='#33383f'; x.fillRect(48,-34,128,15); x.fillStyle='#2a2e34'; x.fillRect(166,-40,16,27);    // barrel + brake
  x.fillStyle='#ff3b30'; x.beginPath(); x.moveTo(-30,-30); x.lineTo(-8,-22); x.lineTo(-30,-15); x.fill();  // red eyes
  x.beginPath(); x.moveTo(16,-30); x.lineTo(-6,-22); x.lineTo(16,-15); x.fill();
  // crown
  x.fillStyle='#e7b53a'; x.strokeStyle='#9a7416'; x.lineWidth=2;
  const cw=92, cb=-50, ch=-92;
  x.beginPath(); x.moveTo(-cw/2,cb); x.lineTo(-cw/2,ch+22); x.lineTo(-cw/4,ch); x.lineTo(0,ch-14); x.lineTo(cw/4,ch); x.lineTo(cw/2,ch+22); x.lineTo(cw/2,cb); x.closePath(); x.fill(); x.stroke();
  x.fillStyle='#b22a1f'; [-cw/4,0,cw/4].forEach(jx=>{ x.beginPath(); x.arc(jx,ch+16,5,0,7); x.fill(); });
  x.restore();
}

// ── B · Cozy painting — World-1 green fields (home), flat & hard-edged ───────
function drawFields(x){
  x.fillStyle='#87CEEB'; x.fillRect(0,0,CW,CH*0.52);                     // World-1 sky
  x.fillStyle='#fff3b0'; x.beginPath(); x.arc(CW*0.74,CH*0.2,50,0,7); x.fill();   // flat sun
  function band(col,base,amp,ph){ x.fillStyle=col; x.beginPath(); x.moveTo(0,CH); x.lineTo(0,base);
    for(let i=0;i<=CW;i+=24){ x.lineTo(i, base+Math.sin(i/110+ph)*amp); }
    x.lineTo(CW, base+Math.sin(CW/110+ph)*amp); x.lineTo(CW,CH); x.closePath(); x.fill(); }   // reach the right edge (no wedge)
  band('#8fd06a', CH*0.46, 14, 0.4);   // far light grass
  band('#6BBF4E', CH*0.56, 20, 1.8);   // World-1 grass
  band('#4e9e3a', CH*0.70, 16, 3.6);   // near grass
  // path (tan, hard-edged)
  x.fillStyle='#C4A882'; x.beginPath(); x.moveTo(CW*0.46,CH); x.lineTo(CW*0.52,CH*0.72); x.lineTo(CW*0.6,CH*0.72); x.lineTo(CW*0.58,CH); x.closePath(); x.fill();
  // stone cottage — flat blocks
  x.fillStyle='#D4C9A8'; x.fillRect(CW*0.6,CH*0.52,64,46);
  x.fillStyle='#A89880'; x.beginPath(); x.moveTo(CW*0.6-6,CH*0.52); x.lineTo(CW*0.6+32,CH*0.52-30); x.lineTo(CW*0.6+70,CH*0.52); x.closePath(); x.fill();
  // chunky low-poly tree (stacked triangles)
  x.fillStyle='#5a3f22'; x.fillRect(CW*0.26-8,CH*0.56,16,66);
  x.fillStyle='#4f8a3a'; x.beginPath(); x.moveTo(CW*0.26-42,CH*0.58); x.lineTo(CW*0.26,CH*0.50-26); x.lineTo(CW*0.26+42,CH*0.58); x.closePath(); x.fill();
  x.fillStyle='#5fa247'; x.beginPath(); x.moveTo(CW*0.26-30,CH*0.50); x.lineTo(CW*0.26,CH*0.50-42); x.lineTo(CW*0.26+30,CH*0.50); x.closePath(); x.fill();
  // birds
  x.strokeStyle='rgba(40,40,40,0.5)'; x.lineWidth=2;
  [[CW*0.4,CH*0.14],[CW*0.46,CH*0.18]].forEach(([bx,by])=>{ x.beginPath(); x.moveTo(bx-8,by); x.lineTo(bx,by-6); x.lineTo(bx+8,by); x.stroke(); });
  // soft frame vignette (kept subtle)
  const vg=x.createRadialGradient(CW/2,CH/2,200,CW/2,CH/2,CH*0.66); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,30,10,0.22)');
  x.fillStyle=vg; x.fillRect(0,0,CW,CH);
}

// ── C · Morale poster — RESISTANCE cobalt + gold ─────────────────────────────
function drawMorale(x){
  x.fillStyle='#e9ddc0'; x.fillRect(0,0,CW,CH);                          // cream
  const cx=CW/2, cy=CH*0.40;
  x.save(); x.translate(cx,cy);                                          // cobalt sunburst
  for(let i=0;i<24;i++){ x.rotate(Math.PI*2/24); x.fillStyle=i%2?'#1f63cf':'#1850a8';
    x.beginPath(); x.moveTo(0,0); x.lineTo(40,-760); x.lineTo(-40,-760); x.closePath(); x.fill(); }
  x.restore();
  x.fillStyle='#e9ddc0'; x.beginPath(); x.arc(cx,cy,128,0,7); x.fill();  // medallion
  x.strokeStyle='#d4a843'; x.lineWidth=8; x.beginPath(); x.arc(cx,cy,128,0,7); x.stroke();
  x.strokeStyle='#14315f'; x.lineWidth=3; x.beginPath(); x.arc(cx,cy,118,0,7); x.stroke();
  // radio tower (cobalt-dark) + gold broadcast arcs
  x.fillStyle='#14315f';
  x.beginPath(); x.moveTo(cx-34,cy+70); x.lineTo(cx-10,cy-78); x.lineTo(cx+10,cy-78); x.lineTo(cx+34,cy+70); x.closePath(); x.fill();
  for(let i=0;i<4;i++){ x.fillRect(cx-30+(i*16),cy+50-(i*32),60-(i*32),6); }
  x.strokeStyle='#d4a843'; x.lineWidth=6; [40,66,92].forEach(r=>{ x.beginPath(); x.arc(cx,cy-78,r,Math.PI*1.15,Math.PI*1.85); x.stroke(); });
  star(x,cx,cy-188,22,'#d4a843');                                        // gold star
  // slogan banner — cobalt w/ gold rule, cream text
  x.fillStyle='#1f63cf'; x.fillRect(40,CH-184,CW-80,118);
  x.strokeStyle='#d4a843'; x.lineWidth=4; x.strokeRect(40,CH-184,CW-80,118);
  x.fillStyle='#f3eede'; x.textAlign='center';
  fitText(x,'KEEP', cx, CH-126, CW-130, 56);
  fitText(x,'TRANSMITTING', cx, CH-76, CW-116, 54);   // auto-shrinks to fit the banner width
}

// ── D · Swappable photo frame — purple-sunset default ───────────────────────
function drawPhoto(x){
  x.fillStyle='#f2eee4'; x.fillRect(0,0,CW,CH);                          // polaroid white
  const m=34, pw=CW-2*m, ph=CH-2*m-104, py=m;
  const sky=x.createLinearGradient(0,py,0,py+ph); sky.addColorStop(0,'#f6b65a'); sky.addColorStop(0.5,'#e8744e'); sky.addColorStop(1,'#7a3b6e');
  x.fillStyle=sky; x.fillRect(m,py,pw,ph);
  const sx=m+pw*0.5, sy=py+ph*0.46; x.fillStyle='rgba(255,240,190,0.95)'; x.beginPath(); x.arc(sx,sy,52,0,7); x.fill();
  x.fillStyle='#5a2f50'; x.beginPath(); x.moveTo(m,py+ph); x.lineTo(m,py+ph*0.72);
  for(let i=0;i<=pw;i+=20){ x.lineTo(m+i, py+ph*0.74+Math.sin(i/70)*14); }
  x.lineTo(m+pw, py+ph*0.74+Math.sin(pw/70)*14); x.lineTo(m+pw,py+ph); x.closePath(); x.fill();   // reach right edge
  // tape corners
  x.fillStyle='rgba(220,205,150,0.6)'; x.save(); x.translate(m+26,py-2); x.rotate(-0.4); x.fillRect(-30,-12,60,24); x.restore();
  x.save(); x.translate(m+pw-26,py-2); x.rotate(0.4); x.fillRect(-30,-12,60,24); x.restore();
  x.fillStyle='#34343a'; x.textAlign='center'; x.font='italic 36px "Bradley Hand",Georgia'; x.fillText('home // somewhere up there', CW/2, CH-44);
}

// ── switcher ─────────────────────────────────────────────────────────────────
const DRAW = { A:drawWanted, B:drawFields, C:drawMorale, D:drawPhoto };
const CAPS = {
  A:'<b>A · WANTED: the TanKING</b><br>Red+gold heraldry (the enemy\'s own colors turned against him), gold-framed mugshot of the crowned tank, "REWARD: THE THRONE." Printed-flyer distress.',
  B:'<b>B · Cozy painting — home</b><br>World-1 green fields, flat banded hills + hard edges, stone cottage, chunky tree. The world above he\'s fighting for.',
  C:'<b>C · Morale — resistance</b><br>Cobalt + gold (your colors, counter to the TanKING\'s red+gold): radio tower + broadcast rays, "KEEP TRANSMITTING."',
  D:'<b>D · Swappable photo</b><br>Polaroid, default = a warm purple-sunset snap. In-game: hover precisely → upload/swap your OWN picture; persists.',
};
function show(k){ const x=dt.getContext(); x.clearRect(0,0,CW,CH); DRAW[k](x); dt.update();
  document.getElementById('cap').innerHTML=CAPS[k];
  ['A','B','C','D'].forEach(j=>document.getElementById('b'+j).classList.toggle('on', j===k)); }
['A','B','C','D'].forEach(k=>document.getElementById('b'+k).onclick=()=>show(k));
show('A');
scene.onBeforeRenderObservable.addOnce(()=>dt.update());

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>

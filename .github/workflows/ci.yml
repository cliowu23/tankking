name: CI

# Gate every PR (and pushes to main) on a clean build + content checks.
# This is the "verify code before it reaches Vercel" step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stale-content check
        run: npm run check

      - name: Build
        run: npm run build

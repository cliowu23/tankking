<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TanKING — Transition Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000810;
    font-family: 'Courier New', monospace;
    color: #00e5ff;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── SCREENS ────────────────────────────────────────── */
  #screens {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 11px;
    letter-spacing: 2px;
  }

  #screen-menu {
    background: #000810;
  }
  #screen-menu h1 { font-size: 28px; color: #fff; letter-spacing: 6px; }
  #screen-menu h1 span { color: #00e5ff; }
  #screen-menu p  { color: #444c5c; font-size: 9px; }

  #screen-game {
    background: #1a2a1a;
    display: none;
  }
  #screen-game .tank-preview {
    width: 80px; height: 40px;
    background: #1a6aee;
    border-radius: 6px 6px 4px 4px;
    position: relative;
    box-shadow: 0 0 24px rgba(26,106,238,0.5);
  }
  #screen-game .tank-preview::after {
    content: '';
    position: absolute;
    width: 10px; height: 30px;
    background: #1a6aee;
    top: -28px; left: 50%; transform: translateX(-50%);
    border-radius: 3px;
  }
  #screen-game p { color: #4db33d; }

  /* ── OVERLAY LAYER (transitions render here) ─────── */
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* ── CONTROLS BAR ───────────────────────────────────── */
  #controls {
    background: rgba(0,8,20,0.95);
    border-top: 1px solid rgba(0,229,255,0.2);
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  #controls span {
    color: #444c5c;
    font-size: 8px;
    letter-spacing: 1px;
    margin-right: 8px;
  }
  .t-btn {
    background: none;
    border: 1px solid rgba(0,229,255,0.3);
    color: #00e5ff;
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    text-transform: uppercase;
  }
  .t-btn:hover { background: rgba(0,229,255,0.08); border-color: #00e5ff; }
  .t-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── LABEL ───────────────────────────────────────────── */
  #current-label {
    position: absolute;
    top: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(0,229,255,0.4);
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="screens">
  <div id="current-label">CLICK A TRANSITION BELOW</div>

  <!-- Screen A: Menu -->
  <div class="screen" id="screen-menu">
    <h1>Tan<span>KING</span></h1>
    <p>PRESS ENTER TO START</p>
    <p style="margin-top:8px">[ T ] SELECT TANK</p>
  </div>

  <!-- Screen B: Game -->
  <div class="screen" id="screen-game">
    <div class="tank-preview"></div>
    <p>IN BATTLE</p>
    <p style="color:#444c5c;font-size:8px">BOOST ████████░░</p>
    <p style="color:#444c5c;font-size:8px">HULL  ██████████</p>
  </div>

  <!-- Overlay canvas for transitions -->
  <canvas id="overlay"></canvas>
</div>

<div id="controls">
  <span>TRANSITIONS →</span>
  <button class="t-btn" onclick="demo('fade')">1 · FADE TO BLACK</button>
  <button class="t-btn" onclick="demo('scan')">2 · SCAN SWEEP</button>
  <button class="t-btn" onclick="demo('checker')">3 · CHECKERBOARD</button>
  <button class="t-btn" onclick="demo('iris')">4 · IRIS WIPE</button>
  <button class="t-btn" onclick="demo('slide')">5 · VERTICAL SLIDE</button>
</div>

<script>
const canvas  = document.getElementById('overlay');
const ctx     = canvas.getContext('2d');
const menuEl  = document.getElementById('screen-menu');
const gameEl  = document.getElementById('screen-game');
const label   = document.getElementById('current-label');
const buttons = document.querySelectorAll('.t-btn');

let currentScreen = 'menu'; // 'menu' | 'game'
let busy = false;

function resize() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

function setScreen(name) {
  currentScreen = name;
  menuEl.style.display = name === 'menu' ? 'flex' : 'none';
  gameEl.style.display = name === 'game' ? 'flex' : 'none';
}

function setBusy(val) {
  busy = val;
  buttons.forEach(b => b.disabled = val);
}

function demo(type) {
  if (busy) return;
  setBusy(true);
  label.textContent = {
    fade:    '1 · FADE TO BLACK',
    scan:    '2 · SCAN SWEEP',
    checker: '3 · CHECKERBOARD',
    iris:    '4 · IRIS WIPE',
    slide:   '5 · VERTICAL SLIDE',
  }[type];

  const next = currentScreen === 'menu' ? 'game' : 'menu';
  transitions[type](next, () => setBusy(false));
}

// ── TRANSITION IMPLEMENTATIONS ──────────────────────────

const transitions = {

  // 1. FADE TO BLACK
  fade(next, done) {
    const HALF = 400; // ms each half
    let start = null;
    let phase = 'out'; // 'out' = fade to black, 'in' = fade back

    function tick(t) {
      if (!start) start = t;
      const elapsed = t - start;
      const progress = Math.min(elapsed / HALF, 1);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const alpha = phase === 'out' ? progress : 1 - progress;
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (progress < 1) {
        requestAnimationFrame(tick);
      } else if (phase === 'out') {
        setScreen(next);
        phase = 'in';
        start = null;
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        done();
      }
    }
    requestAnimationFrame(tick);
  },

  // 2. HORIZONTAL SCAN SWEEP (CRT beam)
  scan(next, done) {
    const W = canvas.width, H = canvas.height;
    const DURATION = 500;
    let start = null;
    let phase = 'out';

    function tick(t) {
      if (!start) start = t;
      const p = Math.min((t - start) / DURATION, 1);

      ctx.clearRect(0, 0, W, H);

      if (phase === 'out') {
        // Beam sweeps down — black fills behind it
        const sweepY = p * H;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, sweepY);
        // Bright scan line
        const grad = ctx.createLinearGradient(0, sweepY - 8, 0, sweepY + 4);
        grad.addColorStop(0, 'rgba(0,229,255,0)');
        grad.addColorStop(0.5, 'rgba(0,229,255,0.9)');
        grad.addColorStop(1, 'rgba(0,229,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, sweepY - 8, W, 12);
      } else {
        // Beam sweeps down again — reveals new screen
        const sweepY = p * H;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, sweepY, W, H - sweepY);
        const grad = ctx.createLinearGradient(0, sweepY - 4, 0, sweepY + 8);
        grad.addColorStop(0, 'rgba(0,229,255,0)');
        grad.addColorStop(0.5, 'rgba(0,229,255,0.9)');
        grad.addColorStop(1, 'rgba(0,229,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, sweepY - 4, W, 12);
      }

      if (p < 1) {
        requestAnimationFrame(tick);
      } else if (phase === 'out') {
        setScreen(next);
        phase = 'in';
        start = null;
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, W, H);
        done();
      }
    }
    requestAnimationFrame(tick);
  },

  // 3. CHECKERBOARD DISSOLVE
  checker(next, done) {
    const W = canvas.width, H = canvas.height;
    const SZ = 24; // tile size
    const COLS = Math.ceil(W / SZ);
    const ROWS = Math.ceil(H / SZ);
    const total = COLS * ROWS;
    // Randomise tile order
    const order = Array.from({length: total}, (_, i) => i).sort(() => Math.random() - 0.5);
    const HALF_MS = 500;
    let start = null;
    let phase = 'out';

    function tick(t) {
      if (!start) start = t;
      const p = Math.min((t - start) / HALF_MS, 1);

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';

      if (phase === 'out') {
        const count = Math.floor(p * total);
        for (let i = 0; i < count; i++) {
          const idx = order[i];
          const col = idx % COLS, row = Math.floor(idx / COLS);
          ctx.fillRect(col * SZ, row * SZ, SZ, SZ);
        }
      } else {
        const count = Math.floor(p * total);
        for (let i = count; i < total; i++) {
          const idx = order[i];
          const col = idx % COLS, row = Math.floor(idx / COLS);
          ctx.fillRect(col * SZ, row * SZ, SZ, SZ);
        }
      }

      if (p < 1) {
        requestAnimationFrame(tick);
      } else if (phase === 'out') {
        setScreen(next);
        phase = 'in';
        start = null;
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, W, H);
        done();
      }
    }
    requestAnimationFrame(tick);
  },

  // 4. IRIS WIPE
  iris(next, done) {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const maxR = Math.sqrt(cx * cx + cy * cy) + 10;
    const HALF = 450;
    let start = null;
    let phase = 'out';

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function tick(t) {
      if (!start) start = t;
      const p = easeInOut(Math.min((t - start) / HALF, 1));

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';

      if (phase === 'out') {
        // Circle shrinks — black fills outside
        const r = maxR * (1 - p);
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.arc(cx, cy, Math.max(r, 0), 0, Math.PI * 2, true);
        ctx.fill();
      } else {
        // Circle grows — black covers outside
        const r = maxR * p;
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.arc(cx, cy, r, 0, Math.PI * 2, true);
        ctx.fill();
      }

      if (p < 1) {
        requestAnimationFrame(tick);
      } else if (phase === 'out') {
        setScreen(next);
        phase = 'in';
        start = null;
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, W, H);
        done();
      }
    }
    requestAnimationFrame(tick);
  },

  // 5. VERTICAL SLIDE (new screen pushes in from bottom)
  slide(next, done) {
    const H = canvas.height;
    const DURATION = 500;
    let start = null;

    // Pre-render next screen to a temp canvas
    setScreen(next);
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width; tmp.height = H;
    // We'll just overlay a black rect sliding up, then show new screen
    setScreen(currentScreen === next ? (next === 'menu' ? 'game' : 'menu') : next);
    // Actually: slide current screen up and reveal next below
    // Simpler: slide black panel down to cover, swap, slide black panel away upward
    const HALF = DURATION / 2;
    let phase = 'cover'; // cover = black slides down in, reveal = black slides up out

    // restore original
    setScreen(currentScreen);

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function tick(t) {
      if (!start) start = t;
      const p = easeInOut(Math.min((t - start) / HALF, 1));

      ctx.clearRect(0, 0, canvas.width, H);
      ctx.fillStyle = '#000810';

      if (phase === 'cover') {
        // Panel slides down from top
        const h = p * H;
        ctx.fillRect(0, 0, canvas.width, h);
        // Cyan leading edge
        ctx.fillStyle = 'rgba(0,229,255,0.6)';
        ctx.fillRect(0, h - 2, canvas.width, 2);
      } else {
        // Panel slides up out
        const y = p * H;
        ctx.fillRect(0, y, canvas.width, H - y);
        ctx.fillStyle = 'rgba(0,229,255,0.6)';
        ctx.fillRect(0, y, canvas.width, 2);
      }

      if (p < 1) {
        requestAnimationFrame(tick);
      } else if (phase === 'cover') {
        setScreen(next);
        phase = 'reveal';
        start = null;
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, canvas.width, H);
        done();
      }
    }
    requestAnimationFrame(tick);
  },

};
</script>
</body>
</html>
